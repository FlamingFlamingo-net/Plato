<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registrar comida — Plato</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2f7d52">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/basecoat-1.0.2/basecoat.cdn.min.css">
  <link rel="stylesheet" href="/css/theme.css?v=1">
  <link rel="stylesheet" href="/css/app.css?v=1">
  <script defer src="/js/install.js?v=1"></script>
  <script type="module" src="/js/log.js?v=1"></script>
</head>
<body>
  <main id="main" class="plato-main plato-main--phone">
    <h1 class="plato-page-title" style="margin-bottom:0.75rem">Registrar comida</h1>
    <nav class="plato-log-type" aria-label="¿Qué quieres registrar?">
      <a href="/log.html" aria-current="page">Comida</a>
      <a href="/activity.html">Actividad</a>
    </nav>
    <form id="log-form" class="plato-form" novalidate>
      <fieldset class="plato-slot-pick" id="slots"><legend>¿Qué comida es?</legend></fieldset>
      <p class="plato-muted plato-small" id="planned" style="margin:0"></p>

      <label class="plato-photo-pick" id="pick">
        <span id="pick-label" class="plato-stack-sm" style="justify-items:center">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <strong>Toma una foto de tu plato</strong>
          <span class="plato-small">o elige una de tu galería</span>
        </span>
        <img id="preview" alt="Vista previa de tu foto" hidden>
        <input type="file" id="photo" name="photo" accept="image/*" capture="environment" required aria-label="Foto de tu comida">
      </label>

      <div class="field">
        <label for="note">Nota <span class="plato-muted">(opcional)</span></label>
        <textarea class="textarea" id="note" name="note" rows="2" maxlength="500" placeholder="Ej. Cambié el arroz por ensalada."></textarea>
      </div>
      <button class="btn" data-size="lg" type="submit" style="width:100%">Enviar</button>
    </form>
  </main>
</body>
</html>
