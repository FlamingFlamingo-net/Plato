services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: "0.40.5"
    image: pocketbase-local:0.40.5
    container_name: pocketbase
    restart: unless-stopped
    ports:
      # Only this PC can open the app. To test on a phone on the same Wi-Fi, change to "8090:8090"
      # for that session and change it back afterwards (plain HTTP on the network is not private).
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data          # database + uploaded files (persisted)
      - ./pb_public:/pb/pb_public      # static files served at /
      - ./pb_hooks:/pb/pb_hooks        # JS hooks
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
